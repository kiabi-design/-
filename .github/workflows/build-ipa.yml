name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project FastDropViewer.xcodeproj \
            -scheme FastDropViewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FastDropViewer.app Payload/
          zip -qr FastDropViewer-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastDropViewer-unsigned-ipa
          path: FastDropViewer-unsigned.ipa
